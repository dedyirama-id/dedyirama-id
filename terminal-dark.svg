<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- Clip path for realistic character-by-character step typing -->
    <clipPath id="cmdClip">
      <rect x="168" y="346" height="20" class="type-step"/>
    </clipPath>
  </defs>

  <style>
    .mono {
      font-family: 'JetBrains Mono', 'Geist Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-variant-ligatures: none;
    }
    .bar-txt   { font-size: 11.5px; fill: #71717a; }
    .bar-act   { font-size: 11.5px; fill: #e4e4e7; font-weight: 600; }
    .pane-hdr  { font-size: 11px; fill: #52525b; }
    .prompt-u  { font-size: 12px; fill: #8ec07c; font-weight: 600; }
    .prompt-p  { font-size: 12px; fill: #83a598; }
    .prompt-s  { font-size: 12px; fill: #71717a; }
    .cmd       { font-size: 12px; fill: #f4f4f5; }
    .k         { font-size: 12px; fill: #83a598; }
    .v         { font-size: 12px; fill: #d4d4d8; }
    .v-str     { font-size: 12px; fill: #b8bb26; }
    .v-muted   { font-size: 12px; fill: #71717a; }
    .sha       { font-size: 11.5px; fill: #fabd2f; }
    .ref       { font-size: 11.5px; fill: #8ec07c; }
    .branch    { font-size: 11.5px; fill: #d3869b; }
    .msg       { font-size: 11.5px; fill: #d4d4d8; }
    .repo-tag  { font-size: 11px; fill: #71717a; }
    .ascii     { font-size: 11.5px; fill: #52525b; white-space: pre; }
    .ascii-hi  { font-size: 11.5px; fill: #8ec07c; white-space: pre; }
    .tbl-hdr   { font-size: 11.5px; fill: #52525b; }
    .tbl-perm  { font-size: 11.5px; fill: #71717a; }
    .tbl-name  { font-size: 11.5px; fill: #83a598; font-weight: 600; }
    .tbl-lang  { font-size: 11.5px; fill: #fabd2f; }
    .tbl-desc  { font-size: 11.5px; fill: #a1a1aa; }

    /* Authentic character-by-character typing using steps() */
    @keyframes typeChars {
      0%, 8%   { width: 0px; }
      32%, 100% { width: 390px; }
    }
    /* Instant stdout flush after Return key, just like a real UNIX shell */
    @keyframes stdoutFlush {
      0%, 34%  { opacity: 0; }
      35%, 100% { opacity: 1; }
    }
    @keyframes nextPrompt {
      0%, 37%  { opacity: 0; }
      38%, 100% { opacity: 1; }
    }
    @keyframes blinkCursor {
      0%, 49%  { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .type-step   { animation: typeChars 14s steps(44, end) infinite; }
    .stdout      { animation: stdoutFlush 14s infinite; }
    .next-line   { animation: nextPrompt 14s infinite; }
    .cursor      { animation: blinkCursor 1s step-end infinite; }
  </style>

  <!-- Outer Terminal Window (Matte Carbon / Gruvbox-Dark-Hard inspired) -->
  <rect x="1" y="1" width="958" height="538" rx="8" fill="#0c0c0e" stroke="#27272a" stroke-width="1.5"/>

  <!-- ==================== TOP WINDOW & TMUX TAB BAR ==================== -->
  <rect x="2" y="2" width="956" height="32" rx="7" fill="#141417"/>
  <rect x="2" y="20" width="956" height="14" fill="#141417"/>
  <line x1="1" y1="34" x2="959" y2="34" stroke="#27272a" stroke-width="1"/>

  <!-- Subtle Muted Window Controls -->
  <circle cx="22" cy="18" r="5" fill="#3f3f46"/>
  <circle cx="38" cy="18" r="5" fill="#3f3f46"/>
  <circle cx="54" cy="18" r="5" fill="#3f3f46"/>

  <!-- Tmux Session & Windows -->
  <text x="78" y="22" class="mono bar-act">[0] dedy@futurelabs:~*</text>
  <text x="242" y="22" class="mono bar-txt">[1] nvim</text>
  <text x="316" y="22" class="mono bar-txt">[2]psql</text>
  <text x="388" y="22" class="mono bar-txt">[3] jupyter</text>

  <text x="802" y="22" class="mono bar-txt">tmux 3.4 • zsh 5.9</text>

  <!-- ====================TMUX SPLIT DIVIDERS ==================== -->
  <!-- Vertical split between Top-Left (Pane 0) and Top-Right (Pane 1) -->
  <line x1="468" y1="34" x2="468" y2="324" stroke="#27272a" stroke-width="1"/>
  <!-- Horizontal split between Top Panes and Bottom Pane (Pane 2) -->
  <line x1="1" y1="324" x2="959" y2="324" stroke="#27272a" stroke-width="1"/>
  <!-- Active pane indicator segment on bottom pane -->
  <line x1="1" y1="324" x2="180" y2="324" stroke="#8ec07c" stroke-width="1.5"/>

  <!-- ==================== PANE 0: FASTFETCH (TOP-LEFT) ==================== -->
  <text x="20" y="56" class="mono prompt-u">dedy@futurelabs</text>
  <text x="135" y="56" class="mono prompt-p">~</text>
  <text x="148" y="56" class="mono prompt-s">%</text>
  <text x="162" y="56" class="mono cmd">fastfetch --logo-type small</text>

  <!-- Minimalist Monochrome / Sage Geometric Glyph -->
  <g transform="translate(20, 78)">
    <text x="0" y="14"  class="mono ascii-hi">    .----.   </text>
    <text x="0" y="30"  class="mono ascii-hi">   /   /  \  </text>
    <text x="0" y="46"  class="mono ascii-hi">  /   / /\ \ </text>
    <text x="0" y="62"  class="mono ascii"> /   / /  \ \</text>
    <text x="0" y="78"  class="mono ascii">\   \ \  / /</text>
    <text x="0" y="94"  class="mono ascii"> \   \_\/ / </text>
    <text x="0" y="110" class="mono ascii">  \______/  </text>
    <text x="0" y="138" class="mono pane-hdr"> [x86_64-linux]</text>
  </g>

  <!-- Authentic Fastfetch Key-Value Readout -->
  <g transform="translate(142, 78)">
    <text x="0" y="14" class="mono prompt-u">dedyirama-id</text>
    <text x="90" y="14" class="mono v-muted">@</text>
    <text x="100" y="14" class="mono prompt-p">github</text>
    <text x="0" y="30" class="mono pane-hdr">──────────────────────────────</text>

    <text x="0" y="48"  class="mono k">bio</text>
    <text x="68" y="48" class="mono v-str">"Creating problems that don't exist"</text>

    <text x="0" y="68"  class="mono k">focus</text>
    <text x="68" y="68" class="mono v">Backend Architecture, LLM/RAG, ETL</text>

    <text x="0" y="88"  class="mono k">lang</text>
