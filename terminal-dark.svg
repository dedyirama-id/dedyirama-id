    <text x="0" y="148" class="mono k">repos</text>
    <text x="68" y="148" class="mono v">13 public · since Dec 2023</text>

    <!-- Classic ANSI 8-Color Strip -->
    <g transform="translate(0, 170)">
      <rect x="0"   y="0" width="18" height="10" fill="#27272a"/>
      <rect x="22"  y="0" width="18" height="10" fill="#cc241d"/>
      <rect x="44"  y="0" width="18" height="10" fill="#98971a"/>
      <rect x="66"  y="0" width="18" height="10" fill="#d79921"/>
      <rect x="88"  y="0" width="18" height="10" fill="#458588"/>
      <rect x="110" y="0" width="18" height="10" fill="#b16286"/>
      <rect x="132" y="0" width="18" height="10" fill="#689d6a"/>
      <rect x="154" y="0" width="18" height="10" fill="#a89984"/>
    </g>
    <g transform="translate(0, 184)">
      <rect x="0"   y="0" width="18" height="10" fill="#52525b"/>
      <rect x="22"  y="0" width="18" height="10" fill="#fb4934"/>
      <rect x="44"  y="0" width="18" height="10" fill="#b8bb26"/>
      <rect x="66"  y="0" width="18" height="10" fill="#fabd2f"/>
      <rect x="88"  y="0" width="18" height="10" fill="#83a598"/>
      <rect x="110" y="0" width="18" height="10" fill="#d3869b"/>
      <rect x="132" y="0" width="18" height="10" fill="#8ec07c"/>
      <rect x="154" y="0" width="18" height="10" fill="#ebdbb2"/>
    </g>
  </g>

